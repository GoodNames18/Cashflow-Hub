name: Build Android APK
on:
 push:
  branches: ['Haeo!']
 workflow_dispatch:
  inputs:
   source_ref:
    description: 'Optional older commit or tag to rebuild as an installable rollback'
    required: false
    type: string
   release_version:
    description: 'Next release name for a rollback, for example 2.8.9 (required with source_ref)'
    required: false
    type: string
permissions:
 contents: read
 id-token: write
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
     with:
      ref: ${{ inputs.source_ref || github.ref }}
   - name: Set rollback release version
     env:
      CFH_ROLLBACK_SOURCE: ${{ inputs.source_ref }}
      CFH_RELEASE_VERSION: ${{ inputs.release_version }}
     run: |
      node --input-type=module <<'JS'
      import {readFileSync,writeFileSync} from 'node:fs';
      const version=process.env.CFH_RELEASE_VERSION;
      if(process.env.CFH_ROLLBACK_SOURCE&&!version)throw Error('An older source must be rebuilt with the next release version.');
      if(version){
       if(!/^\d+\.\d+\.\d+$/.test(version))throw Error('Use a release version such as 2.8.9.');
       const path='android/app/build.gradle',source=readFileSync(path,'utf8');
       if(!/versionName "[^"]+"/.test(source))throw Error('Android version name was not found.');
       writeFileSync(path,source.replace(/versionName "[^"]+"/,'versionName "'+version+'"'));
      }
      JS
   - uses: actions/setup-node@v4
     with:
      node-version: '24'
      cache: npm
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '21'
   - uses: android-actions/setup-android@v3
     with:
      packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      log-accepted-android-sdk-licenses: false
   - run: npm ci
   - run: npm test
   - run: node mobile/build.mjs
   - run: npx cap sync android
   - name: Load permanent signing key
     run: node mobile/fetch-signing.mjs
   - name: Build signed release APK
     env:
      CFH_SIGNING_PROPERTIES: ${{ runner.temp }}/cfh-release-signing/signing.properties
     run: |
      cd android
      chmod +x gradlew
      export CFH_ANDROID_VERSION_CODE=$((1000 + ${{ github.run_number }}))
      ./gradlew :capacitor-local-notifications:testDebugUnitTest assembleRelease --no-daemon
   - name: Verify release signature
     run: |
      APK=android/app/build/outputs/apk/release/app-release.apk
      SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
      "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/cfh-cert-report.txt"
      EXPECTED=$(cat "$RUNNER_TEMP/cfh-release-signing/expected-cert.sha256")
      ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cfh-cert-report.txt")
      test "$ACTUAL" = "$EXPECTED"
      echo "Release signature verified against permanent certificate"
   - uses: actions/upload-artifact@v4
     with:
      name: Cashflow-Hub-Android
      path: android/app/build/outputs/apk/release/app-release.apk
      retention-days: 30

   - name: Remove signing material
     if: always()
     run: rm -rf "$RUNNER_TEMP/cfh-release-signing"
