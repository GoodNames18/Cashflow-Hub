name: Build Android APK
on:
 push:
  branches: ['Haeo!']
 workflow_dispatch:
permissions:
 contents: read
 id-token: write
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '24'
      cache: npm
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '21'
   - uses: android-actions/setup-android@v3
     with:
      packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      log-accepted-android-sdk-licenses: false
   - run: npm ci
   - run: npm test
   - run: node mobile/build.mjs
   - run: npx cap sync android
   - name: Load permanent signing key
     run: node mobile/fetch-signing.mjs
   - name: Build signed release APK
     env:
      CFH_SIGNING_PROPERTIES: ${{ runner.temp }}/cfh-release-signing/signing.properties
     run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
   - name: Verify release signature
     run: |
      APK=android/app/build/outputs/apk/release/app-release.apk
      SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
      "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/cfh-cert-report.txt"
      EXPECTED=$(cat "$RUNNER_TEMP/cfh-release-signing/expected-cert.sha256")
      ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cfh-cert-report.txt")
      test "$ACTUAL" = "$EXPECTED"
      echo "Release signature verified against permanent certificate"
   - uses: actions/upload-artifact@v4
     with:
      name: Cashflow-Hub-Android
      path: android/app/build/outputs/apk/release/app-release.apk
      retention-days: 30

   - name: Remove signing material
     if: always()
     run: rm -rf "$RUNNER_TEMP/cfh-release-signing"
