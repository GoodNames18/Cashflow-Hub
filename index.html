<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Expense</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 14px;
      background: #f5f5f5;
    }

    .box {
      width: 100%;
      max-width: 380px;
      margin: 10px auto;
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 27px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #micButton {
      font-size: 21px;
    }

    textarea {
      width: 100%;
      height: 85px;
      margin-top: 12px;
      padding: 10px;
      font-size: 17px;
      border-radius: 10px;
      border: 1px solid #bbb;
      resize: none;
    }

    #status {
      margin: 12px 0 0;
      min-height: 22px;
      font-size: 15px;
    }

    #result {
      display: none;
      text-align: left;
      background: #f1f1f1;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>💰 Expense</h1>


  <!-- MICROPHONE BUTTON -->
  <button id="micButton" onclick="startListening()">
    🎤 Tap to Speak
  </button>


  <!-- STATUS -->
  <div id="status">
    Ready
  </div>


  <!-- VOICE TEXT -->
  <textarea
    id="expenseText"
    placeholder="Your expense will appear here..."
  ></textarea>


  <!-- MANUAL BACKUP BUTTON -->
  <button id="addButton" onclick="sendExpense()">
    Add Expense
  </button>


  <!-- RESULT -->
  <div id="result"></div>

</div>



<script>

// ========================================================
// GOOGLE APPS SCRIPT BACKEND
// IMPORTANT:
// ONLY /exec goes here.
// ========================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzuggDaGCaF9L_3VJhFreUViGB4AEeapU7w3O_CoL7LMG9xdgSBL4YnlwVz_ojpSvo/exec";


// Prevent duplicate submissions
let isSaving = false;

let recognition;



// ========================================================
// START MICROPHONE
// ========================================================

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    document.getElementById("status").innerText =
      "❌ Speech recognition is not supported.";

    return;
  }


  recognition = new SpeechRecognition();


  // Filipino works for Tagalog / Taglish / English
  recognition.lang = "fil-PH";

  recognition.interimResults = false;

  recognition.continuous = false;

  recognition.maxAlternatives = 1;


  document.getElementById("status").innerText =
    "🎤 Listening...";


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;


    document.getElementById("expenseText").value =
      text;


    document.getElementById("status").innerText =
      "✅ Heard — adding...";


    // ====================================================
    // AUTO SAVE
    // ====================================================

    setTimeout(function() {

      sendExpense();

    }, 300);
  };


  recognition.onerror = function(event) {

    document.getElementById("status").innerText =
      "❌ Voice error: " + event.error;
  };


  recognition.onend = function() {

    if (
      document.getElementById("status").innerText ===
      "🎤 Listening..."
    ) {

      document.getElementById("status").innerText =
        "Ready";
    }
  };


  try {

    recognition.start();

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}



// ========================================================
// SEND EXPENSE TO GOOGLE SHEETS
// ========================================================

function sendExpense() {

  // Prevent double saving
  if (isSaving) return;


  const text =
    document
      .getElementById("expenseText")
      .value
      .trim();


  if (!text) {

    document.getElementById("status").innerText =
      "Speak or type an expense first.";

    return;
  }


  isSaving = true;


  document.getElementById("status").innerText =
    "Saving...";


  document.getElementById("addButton").disabled =
    true;


  document.getElementById("micButton").disabled =
    true;



  // ======================================================
  // UNIQUE JSONP CALLBACK
  // ======================================================

  const callbackName =
    "expenseCallback_" + Date.now();


  let finished = false;



  // ======================================================
  // CALLBACK FROM APPS SCRIPT
  // ======================================================

  window[callbackName] = function(result) {

    finished = true;

    isSaving = false;


    document.getElementById("addButton").disabled =
      false;

    document.getElementById("micButton").disabled =
      false;


    // ====================================================
    // SUCCESS
    // ====================================================

    if (result && result.success) {

      document.getElementById("status").innerText =
        "✅ Expense added";


      const amount =
        Number(result.amount).toLocaleString(
          "en-PH",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );


      const resultBox =
        document.getElementById("result");


      resultBox.style.display =
        "block";


      resultBox.innerHTML =
        "<strong>Added</strong><br>" +

        "₱" + amount + "<br>" +

        (result.merchant || "") +

        (result.category
          ? " • " + result.category
          : "") +

        (result.payment
          ? " • " + result.payment
          : "");


      // Clear input after successful save
      document.getElementById("expenseText").value =
        "";
    }


    // ====================================================
    // ERROR FROM APPS SCRIPT
    // ====================================================

    else {

      document.getElementById("status").innerText =
        "❌ " +
        (
          result && result.error
            ? result.error
            : "Could not add expense"
        );
    }


    cleanup();
  };



  // ======================================================
  // CREATE REQUEST TO APPS SCRIPT
  // ======================================================

  const script =
    document.createElement("script");


  script.id =
    "expenseRequest_" + Date.now();


  script.src =
    APPS_SCRIPT_URL +

    "?action=expense" +

    "&text=" +
    encodeURIComponent(text) +

    "&callback=" +
    encodeURIComponent(callbackName) +

    "&t=" +
    Date.now();



  // ======================================================
  // NETWORK ERROR
  // ======================================================

  script.onerror = function() {

    if (finished) return;


    finished = true;

    isSaving = false;


    document.getElementById("addButton").disabled =
      false;

    document.getElementById("micButton").disabled =
      false;


    document.getElementById("status").innerText =
      "❌ Could not connect to Google Sheets";


    cleanup();
  };



  // ======================================================
  // CLEANUP
  // ======================================================

  function cleanup() {

    try {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    } catch (e) {}


    try {

      delete window[callbackName];

    } catch (e) {}
  }



  document.body.appendChild(script);



  // ======================================================
  // 15 SECOND TIMEOUT
  // ======================================================

  setTimeout(function() {

    if (finished) return;


    finished = true;

    isSaving = false;


    document.getElementById("addButton").disabled =
      false;

    document.getElementById("micButton").disabled =
      false;


    document.getElementById("status").innerText =
      "❌ Could not connect to Google Sheets";


    cleanup();

  }, 15000);
}

</script>

</body>
</html>
