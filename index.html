<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 14px;
      background: #f5f5f5;
    }

    .box {
      max-width: 380px;
      margin: 10px auto;
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
    }

    #micButton {
      font-size: 21px;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 12px;
      padding: 10px;
      font-size: 17px;
      border-radius: 10px;
      border: 1px solid #bbb;
      resize: none;
    }

    #status {
      margin: 10px 0 0;
      min-height: 20px;
      font-size: 14px;
    }

    #result {
      display: none;
      text-align: left;
      background: #f1f1f1;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>💰 Expense</h1>

  <button id="micButton" onclick="startListening()">
    🎤 Tap to Speak
  </button>

  <div id="status">Ready</div>

  <textarea
    id="expenseText"
    placeholder="Your expense will appear here..."
  ></textarea>

  <button onclick="sendExpense()">
    Add Expense
  </button>

  <div id="result"></div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzuggDaGCaF9L_3VJhFreUViGB4AEeapU7w3O_CoL7LMG9xdgSBL4YnlwVz_ojpSvo/exec?action=expense&text=MBCC%20100%20Jabi&callback=test";


let recognition;


function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    document.getElementById("status").innerText =
      "Speech recognition is not supported in this browser.";

    return;
  }


  recognition = new SpeechRecognition();

  // Good default for Tagalog + Taglish
  recognition.lang = "fil-PH";

  recognition.interimResults = false;
  recognition.continuous = false;


  document.getElementById("status").innerText =
    "🎤 Listening...";


recognition.onresult = function(event) {

  const text = event.results[0][0].transcript;

  document.getElementById("expenseText").value = text;

  document.getElementById("status").innerText =
    "✅ Heard — adding...";

  // Automatically add to Google Sheets
  sendExpense();
};


  recognition.onerror = function(event) {

    document.getElementById("status").innerText =
      "Voice error: " + event.error;
  };


  recognition.onend = function() {

    if (
      document.getElementById("status").innerText ===
      "🎤 Listening..."
    ) {
      document.getElementById("status").innerText =
        "Ready";
    }
  };


  recognition.start();
}

let isSaving = false;

function sendExpense() {

  // Prevent duplicate submissions
  if (isSaving) return;

  const text =
    document.getElementById("expenseText")
      .value
      .trim();

  if (!text) {
    document.getElementById("status").innerText =
      "Speak an expense first.";
    return;
  }

  isSaving = true;

  document.getElementById("status").innerText =
    "Saving...";

  const callbackName =
    "expenseCallback_" + Date.now();

  window[callbackName] = function(result) {

    isSaving = false;

    document.getElementById("status").innerText =
      result.success
        ? "✅ Expense added"
        : "❌ " + (result.error || "Error");

    if (result.success) {

      const amount =
        Number(result.amount).toLocaleString(
          "en-PH",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

      const box =
        document.getElementById("result");

      box.style.display = "block";

      box.innerHTML =
        "<strong>Added</strong><br>" +
        "₱" + amount + "<br>" +
        (result.merchant || "") +
        (result.category
          ? " • " + result.category
          : "") +
        (result.payment
          ? " • " + result.payment
          : "");

      document.getElementById("expenseText").value = "";
    }

    delete window[callbackName];
    script.remove();
  };

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?action=expense" +
    "&text=" + encodeURIComponent(text) +
    "&callback=" + callbackName;

  document.body.appendChild(script);
  setTimeout(function() {

  if (isSaving) {
    isSaving = false;

    document.getElementById("status").innerText =
      "❌ Could not connect to Google Sheets";
  }

}, 10000);
}


</script>

</body>
</html>
